apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-manager
  template:
    metadata:
      labels:
        app: file-manager
    spec:
      containers:
        - name: file-manager
          image: your-account/file-manager:latest
          ports:
            - containerPort: 5000

          startupProbe:
            httpGet:
              path: /health/startup
              port: 5000
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            periodSeconds: 10
            failureThreshold: 3
