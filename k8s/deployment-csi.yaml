apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-manager-csi
  namespace: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-manager-csi
  template:
    metadata:
      labels:
        app: file-manager-csi
    spec:
      serviceAccountName: file-app
      containers:
        - name: file-manager
          image: YOUR_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/file-manager-csi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: YOUR_PRIVATE_S3_BUCKET
            - name: DB_HOST
              value: YOUR_RDS_ENDPOINT
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: YOUR_DATABASE_NAME
            - name: DB_SECRET_FILE
              value: /mnt/secrets/db-secret
          volumeMounts:
            - name: db-secret-volume
              mountPath: /mnt/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/startup
              port: 5000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: db-secret-volume
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: file-manager-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: backend
spec:
  selector:
    app: file-manager-csi
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
